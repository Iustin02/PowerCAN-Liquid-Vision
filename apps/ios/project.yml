name: PowerCANLiquidVision
options:
  bundleIdPrefix: com.powercan
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: 1
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  PowerCANLiquidVision:
    type: application
    platform: iOS
    sources:
      - path: PowerCANLiquidVision
        excludes:
          - "Resources/Info.plist"
          - "Resources/car_top.png"
    settings:
      base:
        INFOPLIST_FILE: PowerCANLiquidVision/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.powercan.liquidvision
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: 2
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
        INFOPLIST_KEY_CFBundleDisplayName: "PowerCAN LV"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    entitlements:
      path: PowerCANLiquidVision/Resources/PowerCANLiquidVision.entitlements
